<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Respire — respiration guidée, jour après jour</title>
  <meta name="description" content="Des sessions de respiration guidée pour réapprendre à respirer calmement : par le nez, tout en douceur, avec une expiration lente. Quelques minutes par jour." />
  <meta name="theme-color" content="#070b18" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Respire" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <button class="tab on" data-action="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 9.8V19a1 1 0 0 0 1 1H10v-5.5h4V20h3.5a1 1 0 0 0 1-1V9.8"/></svg>
        <span>Accueil</span>
      </button>
      <button class="tab" data-action="tab" data-tab="progress" aria-current="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
        <span>Progrès</span>
      </button>
      <button class="tab" data-action="tab" data-tab="settings" aria-current="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>Réglages</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="session" class="session" hidden></div>
  <div id="onboarding" class="onboarding" hidden></div>

  <dialog id="dialog" class="dialog">
    <form method="dialog">
      <h3></h3>
      <p></p>
      <div class="btn-row">
        <button class="btn ghost" value="cancel">Annuler</button>
        <button class="btn danger" value="ok">Confirmer</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;font-family:system-ui;color:#fff">Respire a besoin de JavaScript pour guider ta respiration.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
